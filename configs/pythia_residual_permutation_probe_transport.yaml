name: pythia_residual_permutation_probe_transport
runner: experiments.pythia_residual_permutation_probe_transport:run
seed: 42
data_seeds: [42, 137]
deterministic: true
stage: controlled_residual_permutation
training: false

models:
  pythia_seed1234:
    backend: huggingface
    id: EleutherAI/pythia-410m
    revision: 9879c9b5f8bea9051dcb0e68dff21493d67e9d4f
    layers: 24
    hidden_size: 1024
  pythia_seed1:
    backend: huggingface
    id: EleutherAI/pythia-410m-seed1
    revision: 33803c4f5a1e9a4bece59e52f17bb8755add33e1
    layers: 24
    hidden_size: 1024

dataset:
  backend: huggingface
  id: allenai/wildguardmix
  revision: d29c47f41c8b51348b5c8e8c81c039b3132b66d1

materials:
  baseline_artifact_prefix: experiments/pythia_seed_probe_transfer
  expected_test_rows: 1699

symmetry:
  width: 1024
  permutation_seeds: [42, 137]
  probed_depths: [0.25, 0.50, 0.75, 1.00]
  primary_depth: 0.75
  gate_rows: 1699
  gate_batch_size: 8
  gate_max_length: 512
  logit_atol: 0.001
  activation_relative_tolerance: 0.0001

evaluation:
  primary_metrics: [raw_auroc_gap, recovery_fraction]
  secondary_metrics:
    - auroc
    - auprc
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - expected_calibration_error
    - tn
    - fp
    - fn
    - tp
    - tpr_at_fpr
    - threshold_transfer
    - score_agreement
    - layerwise_results
  retain_row_level: [row_id, label, score, probability, prediction]
  retain_thresholds: true
  operating_fprs: [0.01, 0.05]
  oracle_gate: 0.75
  minimum_gap: 0.10
  minimum_recovery: 0.95
  auroc_recovery_atol: 0.01
  score_atol: 0.0001
  score_rtol: 0.00001
  reference_auroc_atol: 0.00001
  bootstrap_samples: 2000
  confidence_level: 0.95

tracking:
  wandb: true

artifacts:
  backend: huggingface_bucket
  bucket: baimamboukar/coordinate-concept-mismatch
  prefix: experiments/pythia_residual_permutation_probe_transport
  defer_upload: true
