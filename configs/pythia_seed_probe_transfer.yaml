name: pythia_seed_probe_transfer
runner: experiments.pythia_seed_probe_transfer:run
seed: 42
data_seeds: [42, 137]
deterministic: true
stage: full_pilot
training: true

models:
  pythia_seed1234:
    backend: huggingface
    id: EleutherAI/pythia-410m
    revision: 9879c9b5f8bea9051dcb0e68dff21493d67e9d4f
    layers: 24
    hidden_size: 1024
    role: original_training_seed
  pythia_seed1:
    backend: huggingface
    id: EleutherAI/pythia-410m-seed1
    revision: 33803c4f5a1e9a4bece59e52f17bb8755add33e1
    layers: 24
    hidden_size: 1024
    role: independent_training_seed

dataset:
  backend: huggingface
  id: allenai/wildguardmix
  revision: d29c47f41c8b51348b5c8e8c81c039b3132b66d1
  train: { subset: wildguardtrain, split: train }
  test: { subset: wildguardtest, split: test }
  prompt_field: prompt
  label_field: prompt_harm_label
  positive_label: harmful
  negative_label: unharmful
  adversarial_field: adversarial

sampling:
  train_size: 12000
  validation_size: 2000
  test_size: 1699
  balance_labels: true
  stratify_by: [adversarial]
  protect_test: true

activations:
  prompt_format: raw
  token_position: last_non_padding
  max_length: 512
  max_truncation_rate: 0.05
  normalized_depths: [0.25, 0.50, 0.75, 1.00]
  primary_depth: 0.75
  dtype: float16
  storage_dtype: float16
  batch_size: 64

extraction:
  repeatability_rows: 8
  repeatability_atol: 0.0001
  models: [pythia_seed1234, pythia_seed1]

probes:
  primary_families: [linear, cp_degree_2, mlp]
  secondary_families: [linear]
  linear:
    c_values: [0.01, 0.1, 1.0, 10.0]
    max_iter: 1000
  cp_degree_2:
    ranks: [2, 8, 16]
    weight_decays: [0.0, 0.0001]
    learning_rate: 0.001
    batch_size: 512
    max_epochs: 60
    patience: 8
    restart_seeds: [42, 137]
  mlp:
    hidden_size: 32
    weight_decays: [0.0, 0.0001]
    learning_rate: 0.001
    batch_size: 512
    max_epochs: 60
    patience: 8
    restart_seeds: [42, 137]

evaluation:
  primary_metrics: [auroc, auroc_transfer_gap]
  secondary_metrics:
    - auprc
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - expected_calibration_error
    - tn
    - fp
    - fn
    - tp
    - tpr_at_fpr
    - achieved_fpr_at_source_threshold
  retain_row_level: [row_id, label, score, probability, prediction]
  retain_thresholds: true
  operating_fprs: [0.01, 0.05]
  threshold_selection: source_validation_balanced_accuracy
  oracle_gate: 0.75
  minimum_gap: 0.10
  bootstrap_samples: 2000
  confidence_level: 0.95

tracking:
  wandb: true

artifacts:
  backend: huggingface_bucket
  bucket: baimamboukar/coordinate-concept-mismatch
  prefix: experiments/pythia_seed_probe_transfer
  defer_upload: true
