extends: ../defaults.yaml
name: modern_models

models:
  llama:
    backend: huggingface
    id: meta-llama/Llama-3.1-8B-Instruct
    revision: 0e9e39f249a16976918f6564b8830bc894c89659
    artifact_key: llama-3.1-8b-instruct
    layers: 32
    hidden_size: 4096
    role: independent_family
  qwen:
    backend: huggingface
    id: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    artifact_key: qwen3-8b
    layers: 36
    hidden_size: 4096
    role: independent_family
  nemotron:
    backend: huggingface
    id: nvidia/Llama-3.1-Nemotron-Nano-8B-v1
    revision: 54641c1611fcff44fa4865626462445e0a153fc7
    artifact_key: llama-3.1-nemotron-nano-8b-v1
    layers: 32
    hidden_size: 4096
    role: llama_lineage_control
  mistral:
    backend: huggingface
    id: mistralai/Mistral-7B-v0.3
    revision: caa1feb0e54d415e2df31207e5f4e273e33509b1
    artifact_key: mistral-7b-v0.3
    layers: 32
    hidden_size: 4096
    role: independent_family
  granite:
    backend: huggingface
    id: ibm-granite/granite-3.3-8b-base
    revision: cfb7adb44a974653cbb2ff883653971c54dba578
    artifact_key: granite-3.3-8b-base
    layers: 40
    hidden_size: 4096
    role: independent_family

activations:
  dtype: bfloat16
  storage_dtype: bfloat16
  batch_size: 8

extraction:
  models: [llama, qwen, nemotron, mistral, granite]

pipeline:
  stages:
    preflight:
      name: frozen_probe_transfer_baseline
    extract:
      name: frozen_probe_transfer_baseline
    transfer:
      name: frozen_probe_transfer_baseline
      training: true
      claims:
        broad_cross_family: pending
      evaluation:
        primary_metrics: [auroc, auroc_transfer_gap]
        pair_groups:
          reference: [[llama, qwen], [qwen, llama]]
          lineage_control: [[llama, nemotron], [nemotron, llama]]
          primary:
            - [llama, mistral]
            - [mistral, llama]
            - [qwen, mistral]
            - [mistral, qwen]
            - [llama, granite]
            - [granite, llama]
            - [qwen, granite]
            - [granite, qwen]
            - [mistral, granite]
            - [granite, mistral]
          exploratory:
            - [qwen, nemotron]
            - [nemotron, qwen]
            - [mistral, nemotron]
            - [nemotron, mistral]
            - [granite, nemotron]
            - [nemotron, granite]
        oracle_gate: 0.75
        minimum_gap: 0.10
    align:
      name: modern_activation_alignment_recovery
      artifact_variant: combined
      materials:
        source_name: frozen_probe_transfer_baseline
        source_study: modern_models
        expected_train_rows: 12000
        expected_validation_rows: 2000
        expected_test_rows: 1699
      alignment:
        fit_split: train
        diagnostic_split: validation
        primary_depth: 0.75
        depths: [0.75]
        primary_probe_family: linear
        primary_method: permutation_diagonal
        methods:
          - permutation
          - permutation_diagonal
          - orthogonal_procrustes
          - affine_ridge
          - quotient_ridge
        ridge_relative_alpha: 0.0001
        quotient_svd_relative_threshold: 0.001
        negative_control: shuffled_affine_ridge
        shuffled_pairing_seed: 314
        device: cuda
      evaluation:
        primary_metrics:
          - aligned_auroc_improvement
          - recovery_fraction
          - residual_auroc_gap
        additional_metrics:
          - auroc
          - alignment_relative_rmse
          - alignment_mean_cosine
          - negative_control_results
        primary_pair_group: primary
        pair_groups:
          primary:
            - [llama, qwen]
            - [qwen, llama]
            - [llama, mistral]
            - [mistral, llama]
            - [qwen, mistral]
            - [mistral, qwen]
            - [llama, granite]
            - [granite, llama]
            - [qwen, granite]
            - [granite, qwen]
            - [mistral, granite]
            - [granite, mistral]
          lineage_control: [[llama, nemotron], [nemotron, llama]]
          exploratory: [[qwen, nemotron], [nemotron, qwen]]
        oracle_gate: 0.75
        minimum_raw_gap: 0.10
        minimum_improvement: 0.05
        minimum_recovery: 0.50
        require_all_primary_comparisons: true
        lineage_non_degradation_margin: 0.02
        reference_auroc_atol: 0.00001
    symmetry:
      name: modern_residual_permutation_probe_transport
      materials:
        source_name: frozen_probe_transfer_baseline
        source_study: modern_models
        expected_train_rows: 12000
        expected_validation_rows: 2000
        expected_test_rows: 1699
      execution:
        accelerators: [H200]
        minimum_gpu_memory_gb: 120
      symmetry:
        transformation: residual_permutation
        models: [mistral]
        width: 4096
        permutation_seeds: [42, 137]
        probed_depths: [0.75]
        primary_depth: 0.75
        gate_rows: 1699
        smoke_gate_rows: 8
        gate_batch_size: 2
        gate_max_length: 512
        gate_dtype: float64
        logit_atol: 0.00001
        logit_rtol: 0.00001
        activation_relative_tolerance: 0.00001
        estimated_alignment:
          enabled: true
          method: permutation
          fit_split: train
          diagnostic_split: validation
          fit_rows: 2000
          device: cuda
      evaluation:
        primary_metrics:
          - raw_auroc_gap
          - recovery_fraction
          - estimated_recovery_fraction
        additional_metrics:
          - auroc
          - threshold_transfer
          - score_agreement
          - alignment_relative_rmse
          - alignment_mean_cosine
          - permutation_match_fraction
        oracle_gate: 0.75
        minimum_gap: 0.10
        minimum_recovery: 0.95
        auroc_recovery_atol: 0.01
        score_atol: 0.0001
        score_rtol: 0.00001
        reference_auroc_atol: 0.00001
