extends: ../defaults.yaml
name: olmo1_independent_training_sst2

models:
  ai2_olmo1:
    backend: huggingface
    id: allenai/OLMo-1B-hf
    revision: aee7752d9c08ee4775e9b0091426d8410e8f6a89
    artifact_key: ai2-olmo-1b
    layers: 16
    hidden_size: 2048
    role: independent_reference
  amd_olmo1:
    backend: huggingface
    id: amd/AMD-OLMo-1B
    revision: c0aa67729dde701300da70ce5310d7aa117c3730
    artifact_key: amd-olmo-1b
    layers: 16
    hidden_size: 2048
    role: independent_cross_provider_replication

tokenizer:
  backend: huggingface
  id: allenai/OLMo-1B-hf
  revision: aee7752d9c08ee4775e9b0091426d8410e8f6a89

dataset:
  backend: huggingface
  id: stanfordnlp/sst2
  revision: 8d51e7e4887a4caaa95b3fbebbf53c0490b58bbb
  train: {subset: null, split: train}
  test: {subset: null, split: validation}
  prompt_field: sentence
  label_field: label
  positive_label: 1
  negative_label: 0
  adversarial_field: null

sampling:
  train_size: 12000
  validation_size: 2000
  test_size: 872
  balance_labels: true
  stratify_by: []
  protect_test: true

activations:
  add_special_tokens: false
  batch_size: 16
  dtype: bfloat16
  storage_dtype: bfloat16

extraction:
  models: [ai2_olmo1, amd_olmo1]

artifacts:
  dataset_key: sst2-sentiment-v1

pipeline:
  stages:
    prepare:
      name: olmo1_independent_training
      tracking: {wandb: false, local_report: false}
    preflight:
      name: olmo1_independent_training
      tracking: {wandb: false, local_report: false}
    extract:
      name: olmo1_independent_training
      tracking: {wandb: false, local_report: false}
    transfer:
      name: olmo1_independent_probe_transfer
      artifact_variant: sst2-baseline
      training: true
      evaluation:
        primary_metrics: [auroc, auroc_transfer_gap]
        pair_groups:
          primary:
            - [ai2_olmo1, amd_olmo1]
            - [amd_olmo1, ai2_olmo1]
        oracle_gate: 0.75
        minimum_gap: 0.10
    align:
      name: olmo1_independent_alignment
      artifact_variant: sst2-alignment
      materials:
        source_name: olmo1_independent_probe_transfer
        source_study: olmo1_independent_training_sst2
        source_variant: sst2-baseline
        expected_train_rows: 12000
        expected_validation_rows: 2000
        expected_test_rows: 872
      alignment:
        fit_split: train
        diagnostic_split: validation
        primary_depth: 0.75
        depths: [0.25, 0.50, 0.75, 1.00]
        primary_probe_family: linear
        primary_method: permutation_diagonal
        methods:
          - permutation
          - permutation_diagonal
          - orthogonal_procrustes
          - affine_ridge
          - quotient_ridge
        ridge_relative_alpha: 0.0001
        quotient_svd_relative_threshold: 0.001
        negative_control: shuffled_affine_ridge
        shuffled_pairing_seed: 314
        device: cuda
      evaluation:
        primary_metrics:
          - aligned_auroc_improvement
          - recovery_fraction
          - residual_auroc_gap
        additional_metrics:
          - auroc
          - alignment_relative_rmse
          - alignment_mean_cosine
          - negative_control_results
        primary_pair_group: primary
        pair_groups:
          primary:
            - [ai2_olmo1, amd_olmo1]
            - [amd_olmo1, ai2_olmo1]
        oracle_gate: 0.75
        minimum_raw_gap: 0.10
        minimum_improvement: 0.05
        minimum_recovery: 0.50
        reference_auroc_atol: 0.00001
