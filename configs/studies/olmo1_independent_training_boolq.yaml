extends: olmo1_independent_training_sst2.yaml
name: olmo1_independent_training_boolq

dataset:
  backend: huggingface
  id: google/boolq
  revision: 35b264d03638db9f4ce671b711558bf7ff0f80d5
  train: {subset: null, split: train}
  test: {subset: null, split: validation}
  prompt_field: null
  prompt_template: "Question: {question}\nPassage: {passage}"
  prompt_fields: [question, passage]
  label_field: answer
  positive_label: true
  negative_label: false
  adversarial_field: null

sampling:
  train_size: 6000
  validation_size: 1000
  test_size: 3270
  balance_labels: true
  stratify_by: []
  protect_test: true

activations:
  max_length: 1024
  normalized_depths: [0.75]
  primary_depth: 0.75
  batch_size: 8

artifacts:
  dataset_key: boolq-qa-v1

pipeline:
  stages:
    transfer:
      artifact_variant: boolq-baseline
    align:
      artifact_variant: boolq-alignment
      materials:
        source_study: olmo1_independent_training_boolq
        source_variant: boolq-baseline
        expected_train_rows: 6000
        expected_validation_rows: 1000
        expected_test_rows: 3270
      alignment:
        primary_method: affine_ridge
        methods: [affine_ridge, orthogonal_procrustes]
        depths: [0.75]
