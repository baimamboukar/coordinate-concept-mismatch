extends: olmo1_independent_training_sst2.yaml
name: olmo1_independent_training_mnli

dataset:
  backend: huggingface
  id: nyu-mll/glue
  revision: bcdcba79d07bc864c1c254ccfcedcce55bcc9a8c
  train: {subset: mnli, split: train}
  test: {subset: mnli, split: validation_matched}
  prompt_field: null
  prompt_template: "Premise: {premise}\nHypothesis: {hypothesis}"
  prompt_fields: [premise, hypothesis]
  label_field: label
  positive_label: 0
  negative_label: 2
  adversarial_field: null

sampling:
  train_size: 12000
  validation_size: 2000
  test_size: 6692
  balance_labels: true
  stratify_by: []
  protect_test: true

activations:
  normalized_depths: [0.75]
  primary_depth: 0.75
  batch_size: 16

artifacts:
  dataset_key: mnli-entailment-contradiction-v1

pipeline:
  stages:
    transfer:
      artifact_variant: mnli-baseline
    align:
      artifact_variant: mnli-alignment
      materials:
        source_study: olmo1_independent_training_mnli
        source_variant: mnli-baseline
        expected_train_rows: 12000
        expected_validation_rows: 2000
        expected_test_rows: 6692
      alignment:
        primary_method: affine_ridge
        methods: [affine_ridge, orthogonal_procrustes]
        depths: [0.75]
