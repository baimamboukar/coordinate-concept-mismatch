extends: smollm_heldout_map_replication.yaml
name: smollm_shared_map_objective_generalization

sampling:
  test_size: 2000
  disjoint_calibration:
    train_size: 12000
    validation_size: 2000
    holdout_seed: 314
    evaluation_source: unused_training_pool

execution:
  alignment_workers: 2
  prepare_materials: true

reuse_materials:
  study: smollm_shared_map_objective_generalization
  transfer: shared_map_objective_generalization
  align: shared_map_objective_generalization

tasks:
  sst2:
    sampling: {test_size: 2000}
    artifacts:
      dataset_key: sst2-shared-map-objective-v1
      split_reference: {dataset_key: sst2-sentiment-v1, model: smollm1}
  wildguard:
    sampling: {test_size: 2000}
    artifacts:
      dataset_key: wildguardmix-shared-map-objective-v1
      split_reference: {dataset_key: wildguardmix-v1, model: smollm1}
  ag_news:
    sampling: {test_size: 2000}
    artifacts:
      dataset_key: ag-news-shared-map-objective-v1
      split_reference: {dataset_key: ag-news-world-business-v1, model: smollm1}
  mnli:
    sampling: {test_size: 2000}
    artifacts:
      dataset_key: mnli-shared-map-objective-v1
      split_reference: {dataset_key: mnli-entailment-contradiction-v1, model: smollm1}

fit_conditions:
  sst2: null
  wildguard: null
  pooled_equal: null
  pooled_full: null
  uniform_fixed:
    datasets: {sst2: 12000, wildguard: 12000}
    split: calibration
    primary_method: affine_ridge
    methods: [affine_ridge]
    fitting:
      weighting: uniform
      relative_alphas: [0.0001]
      selection_metric: worst_feature_mse
  reconstruction_selected:
    datasets: {sst2: 12000, wildguard: 12000}
    split: calibration
    primary_method: affine_ridge
    methods: [affine_ridge]
    fitting:
      weighting: source_variance
      source_variance_powers: [0.0, 0.25, 0.5, 0.75, 1.0]
      relative_alphas: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0]
      selection_metric: worst_feature_mse
  probe_selected:
    datasets: {sst2: 12000, wildguard: 12000}
    split: calibration
    primary_method: affine_ridge
    methods: [affine_ridge]
    fitting:
      weighting: source_variance
      source_variance_powers: [0.0, 0.25, 0.5, 0.75, 1.0]
      relative_alphas: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0]
      selection_metric: worst_probe_score_mse
  probe_bank:
    datasets: {sst2: 12000, wildguard: 12000}
    split: calibration
    primary_method: probe_bank_affine
    methods: [affine_ridge, probe_bank_affine]
    fitting:
      weighting: source_variance
      source_variance_powers: [0.0, 0.25, 0.5, 0.75, 1.0]
      relative_alphas: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0]
      selection_metric: worst_feature_mse

decision_rules:
  primary_condition: probe_bank
  heldout_requires_included_compatibility: true
  interpretation: confirmatory_objective_generalization

pipeline:
  stages:
    prepare:
      name: shared_map_objective_generalization
      tracking: {wandb: false, local_report: false}
    preflight:
      name: shared_map_objective_generalization
      tracking: {wandb: false, local_report: false}
    extract:
      name: shared_map_objective_generalization
      tracking: {wandb: false, local_report: false}
    transfer:
      name: shared_map_objective_generalization
      training: true
    align:
      name: shared_map_objective_generalization
      training: true
      alignment:
        fit_split: calibration
        diagnostic_split: calibration_validation
        primary_depth: 0.75
        depths: [0.75]
        primary_probe_family: linear
        primary_method: affine_ridge
        methods: [affine_ridge]
