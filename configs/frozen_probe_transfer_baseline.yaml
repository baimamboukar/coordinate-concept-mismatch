name: frozen_probe_transfer_baseline
runner: experiments.frozen_probe_transfer_baseline:run
seed: 42
data_seeds: [42, 137]
deterministic: true
stage: modern_baseline
phase: core
training: true

models:
  llama:
    backend: huggingface
    id: meta-llama/Llama-3.1-8B-Instruct
    revision: 0e9e39f249a16976918f6564b8830bc894c89659
    layers: 32
    hidden_size: 4096
    role: independent_family
  qwen:
    backend: huggingface
    id: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    layers: 36
    hidden_size: 4096
    role: independent_family
  nemotron:
    backend: huggingface
    id: nvidia/Llama-3.1-Nemotron-Nano-8B-v1
    revision: 54641c1611fcff44fa4865626462445e0a153fc7
    layers: 32
    hidden_size: 4096
    role: llama_lineage_control

dataset:
  backend: huggingface
  id: allenai/wildguardmix
  revision: d29c47f41c8b51348b5c8e8c81c039b3132b66d1
  train: { subset: wildguardtrain, split: train }
  test: { subset: wildguardtest, split: test }
  prompt_field: prompt
  label_field: prompt_harm_label
  positive_label: harmful
  negative_label: unharmful
  adversarial_field: adversarial

sampling:
  train_size: 12000
  validation_size: 2000
  test_size: 1699
  balance_labels: true
  stratify_by: [adversarial]
  protect_test: true

activations:
  prompt_format: raw
  token_position: last_non_padding
  max_length: 512
  max_truncation_rate: 0.05
  normalized_depths: [0.25, 0.50, 0.75, 1.00]
  primary_depth: 0.75
  dtype: bfloat16
  storage_dtype: bfloat16
  batch_size: 8

extraction:
  mode: full
  repeatability_rows: 8
  repeatability_atol: 0.0001
  models: [llama, qwen, nemotron]
  jobs:
    - { name: extract_llama, model: llama, accelerator: H100, gpu_count: 1 }
    - { name: extract_qwen, model: qwen, accelerator: H100, gpu_count: 1 }
    - { name: extract_nemotron, model: nemotron, accelerator: H100, gpu_count: 1 }

claims:
  broad_three_family: pending

execution:
  accelerator: H100
  gpu_count: 1
  minimum_cuda_driver_support: 13.0
  minimum_gpu_memory_gb: 75
  minimum_disk_free_gb: 50

probes:
  primary_families: [linear, cp_degree_2, mlp]
  secondary_families: [linear]
  linear:
    c_values: [0.01, 0.1, 1.0, 10.0]
    max_iter: 1000
  cp_degree_2:
    ranks: [2, 8, 16]
    weight_decays: [0.0, 0.0001]
    learning_rate: 0.001
    batch_size: 512
    max_epochs: 60
    patience: 8
    restart_seeds: [42, 137]
  mlp:
    hidden_size: 32
    weight_decays: [0.0, 0.0001]
    learning_rate: 0.001
    batch_size: 512
    max_epochs: 60
    patience: 8
    restart_seeds: [42, 137]

evaluation:
  primary_metrics: [auroc, auroc_transfer_gap]
  pair_groups:
    primary: [[llama, qwen], [qwen, llama]]
    lineage_control: [[llama, nemotron], [nemotron, llama]]
    exploratory: [[qwen, nemotron], [nemotron, qwen]]
  secondary_metrics:
    - auprc
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - expected_calibration_error
    - tn
    - fp
    - fn
    - tp
    - tpr_at_fpr
    - achieved_fpr_at_source_threshold
  retain_row_level: [row_id, label, score, probability, prediction]
  retain_thresholds: true
  oracle_gate: 0.75
  minimum_gap: 0.10
  bootstrap_samples: 2000
  confidence_level: 0.95
  operating_fprs: [0.01, 0.05]
  threshold_selection: source_validation_balanced_accuracy

expected_outputs:
  metrics_rows: 108
  prediction_rows: 183492
  transfer_gap_rows: 72
  probe_bundles: 6

tracking:
  wandb: true
  mode: offline

artifacts:
  backend: huggingface_bucket
  bucket: baimamboukar/coordinate-concept-mismatch
  prefix: experiments/frozen_probe_transfer_baseline/modern_phase
  defer_upload: true
  worker_upload: true
  verify_anonymously: true
