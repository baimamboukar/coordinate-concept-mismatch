minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: check-yaml
        name: check YAML
        entry: uv run check-yaml
        language: system
        files: \.(yaml|yml)$
      - id: check-toml
        name: check TOML
        entry: uv run check-toml
        language: system
        files: \.toml$
      - id: check-merge-conflict
        name: check merge conflicts
        entry: uv run check-merge-conflict
        language: system
      - id: check-case-conflict
        name: check filename case conflicts
        entry: uv run check-case-conflict
        language: system
      - id: check-symlinks
        name: check symlinks
        entry: uv run check-symlinks
        language: system
      - id: detect-private-key
        name: detect private keys
        entry: uv run detect-private-key
        language: system
      - id: check-added-large-files
        name: block large files
        entry: uv run check-added-large-files --maxkb=1024
        language: system
      - id: trailing-whitespace
        name: remove trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
      - id: mixed-line-ending
        name: normalize line endings
        entry: uv run mixed-line-ending --fix=lf
        language: system
      - id: debug-statements
        name: detect debug statements
        entry: uv run debug-statement-hook
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q --strict-config --strict-markers
        language: system
        pass_filenames: false
      - id: conventional-commit
        name: conventional commit message
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
